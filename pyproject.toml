[project]
name = "pelican-pagination"
version = "2.0.1"
description = "Paginate articles"
authors = [{ name = "Bryan Weber", email = "bryan.w.weber@gmail.com" }]
dependencies = ["pelican >=4.5"]
requires-python = ">=3.8.1,<4.0"
readme = "README.md"
license = { text = "BSD-3-Clause" }
keywords = ["pelican", "plugin", "pagination"]
classifiers = [
  "Development Status :: 5 - Stable",
  "Environment :: Console",
  "Framework :: Pelican",
  "Framework :: Pelican :: Plugins",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/bryanwweber/pelican-pagination"
Source = "https://github.com/bryanwweber/pelican-pagination"
Documentation = "https://docs.getpelican.com"
Funding = "https://donate.getpelican.com/"
Issues = "https://github.com/bryanwweber/pelican-pagination/issues"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "W",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "RUF", # Ruff rules
]

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = ["ruff>=0.3.2", "pyright>=1.1.353"]

[tool.pdm.scripts]
ruff_check_lint = { cmd = "ruff check pelican" }
ruff_format_lint = { cmd = "ruff format --check pelican" }
lint = { composite = ["ruff_check_lint", "ruff_format_lint"] }
ruff_check_format = { cmd = "ruff check --fix pelican" }
ruff_format_format = { cmd = "ruff format pelican" }
format = { composite = ["ruff_check_format", "ruff_format_format"] }

[tool.pdm.build]
includes = ["pelican/"]
